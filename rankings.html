<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WPS Rankings 2009–2026</title><style>body{margin:0;background:#07111f;color:#eef7ff;font-family:system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px}h1{font-size:clamp(2rem,5vw,4rem)}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#0e1d2f;padding:14px;border-radius:16px;position:sticky;top:8px}select,input{padding:11px;border-radius:10px;border:1px solid #263b56;background:#091625;color:#eef7ff}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:18px}.card{background:#0e1d2f;border:1px solid #263b56;border-radius:15px;padding:16px}.badge{display:inline-block;background:#17344b;color:#bcf4ed;padding:5px 9px;border-radius:99px;font-weight:700;font-size:.8rem}a{color:#8fc5ff}.muted{color:#9eb1c8}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}</style></head><body><main><a href="index.html">← Clasificación</a><h1>World Para Swimming Rankings</h1><p class="muted">Archivo histórico desde 2009: P50/P25 y masculino/femenino.</p><div class="filters"><input id="q" placeholder="Buscar año…"><select id="course"><option value="">P25 y P50</option><option>LC</option><option>SC</option></select><select id="gender"><option value="">Masculino y femenino</option><option value="M">Masculino</option><option value="F">Femenino</option></select><select id="status"><option value="">Todos</option><option value="ok">Con datos</option><option value="empty">Sin datos</option></select></div><p id="summary" class="muted">Cargando…</p><section id="cards" class="cards"></section></main><script>let items=[];const $=x=>document.getElementById(x);function render(){const q=$('q').value.trim(),c=$('course').value,g=$('gender').value,s=$('status').value;const f=items.filter(x=>(!q||String(x.year).includes(q))&&(!c||x.course===c)&&(!g||x.gender===g)&&(!s||(s==='ok'?x.records>0:x.records===0)));$('summary').textContent=`${f.length} bloques · ${f.reduce((a,x)=>a+(x.records||0),0)} resultados`;$('cards').innerHTML=f.map(x=>`<article class="card"><span class="badge">${x.year} · ${x.course_label} · ${x.gender_label}</span><h2>${x.records||0} resultados</h2>${x.file?`<a href="${x.file}">Descargar CSV</a>`:`<span class="muted">${x.status||'No disponible'}</span>`}</article>`).join('')}fetch('rankings/manifest.json?'+Date.now()).then(r=>r.json()).then(d=>{items=d.items||[];render()}).catch(()=>{$('summary').textContent='La descarga todavía no ha terminado.'});['q','course','gender','status'].forEach(id=>$(id).addEventListener('input',render));</script></body></html>
