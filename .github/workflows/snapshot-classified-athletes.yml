name: Snapshot classified athletes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'download_s25_complete.py'
      - '.github/workflows/snapshot-classified-athletes.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium
      - name: Download complete WPS 2025 season
        id: capture
        continue-on-error: true
        run: python download_s25_complete.py
      - name: Commit complete S25 data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Add complete WPS S25 season"
          git push
      - name: Fail if capture failed
        if: steps.capture.outcome == 'failure'
        run: exit 1
