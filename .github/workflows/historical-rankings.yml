name: Rebuild WPS rankings 2009-present

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scrape_historical_rankings.py'
      - '.github/workflows/historical-rankings.yml'

permissions:
  contents: write

concurrency:
  group: historical-wps-rankings
  cancel-in-progress: true

jobs:
  download-year:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium
      - name: Download ${{ matrix.year }}
        env:
          YEAR: ${{ matrix.year }}
        run: python scrape_historical_rankings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rankings-${{ matrix.year }}
          path: rankings/${{ matrix.year }}
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: download-year
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove every previous ranking result
        run: rm -rf rankings
      - uses: actions/download-artifact@v4
        with:
          pattern: rankings-*
          path: incoming
      - name: Build clean archive and manifest
        run: |
          python - <<'PY'
          import json, shutil
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('rankings'); root.mkdir()
          items=[]
          for artifact in sorted(Path('incoming').glob('rankings-*')):
              year=artifact.name.split('-',1)[1]
              dst=root/year
              shutil.copytree(artifact,dst)
              manifest=dst/'manifest.json'
              if manifest.exists():
                  items.extend(json.loads(manifest.read_text(encoding='utf-8')).get('items',[]))
          items.sort(key=lambda x:(int(x.get('year',0)),x.get('course',''),x.get('gender','')),reverse=True)
          payload={'generated_at':datetime.now(timezone.utc).isoformat(),'source':'https://www.paralympic.org/swimming/rankings','years':[2009,2026],'items':items,'blocks':len(items),'blocks_with_data':sum(int(x.get('records',0))>0 for x in items),'records':sum(int(x.get('records',0)) for x in items)}
          (root/'manifest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(payload)
          PY
      - name: Publish clean ranking archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rankings
          git diff --cached --quiet || git commit -m "Rebuild WPS rankings archive from 2009"
          git push
